guardrail: finding-before-fix
order: 5
skill: guardrail-finding-before-fix
role: analyst
attests:
  in: writes the finding before touching the system, as the observation, the timestamp, and the control
    it fails, so a later reader can tell what was broken apart from what was done about it
  out: remediates with no prior record and says so plainly, naming the evidence the fix destroyed and why
    it could not wait, rather than backfilling a finding that now describes the repair
card: No remediation leaves this seat without the finding written and timestamped first, in a record this
  seat must not later amend. A finding composed after the fix landed describes the repair rather than the
  failure, and a control this seat both closed and attested is the defect this guardrail exists to catch.

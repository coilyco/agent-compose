[project]
name = "agent-compose-checks"
version = "0.1.0"
description = "Go/Python composer parity checks, and evalkit, the board this roster derives."
requires-python = ">=3.12"
# housecast now carries only the generic grading engine (housecast.grade) and
# the unrelated MCP tool-description eval loop. Everything shaped like this
# roster (Role/Personality/Boundary, the Python composer that mirrors
# cmd/agent-compose, and evalkit, which derives the eval board from THIS
# roster) moved into this repo (teable:coilyco-flight-deck/agent-compose#7929
# follow-up): housecast was never meant to hold the specific records being
# evaluated, nor even the acompose-shaped concepts (role, personality,
# boundary) themselves. `evalkit.matrix`'s output already spoke the generic
# entity/attribute vocabulary `housecast.grade` scores against; only its input
# shape was agent-compose's. `[eval]` pulls in what housecast.grade.schema and
# evalkit/task.py's inspect_ai integration both need.
#
# Pinned by rev rather than tag while the roster moves ahead of a release: a
# housecast-v* tag triggers a PyPI publish, and spending a version number to
# satisfy a dev-time parity check is the wrong trade. Restore a tag pin at the
# next real release.
dependencies = ["housecast[eval]>=0.3.0", "pyyaml>=6.0"]

[tool.uv.sources]
housecast = { git = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast.git", rev = "bf834789dc7e48f8f34f558dd3572f3b72e9cbc4" }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks", "evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["checks", "evalkit"]

[tool.pytest.ini_options]
testpaths = ["checks/tests", "evalkit/tests"]

# The board coverage gate. Reporting rather than blocking on purpose: the
# grader is a human, so blocking puts every roster edit behind an annotation
# session. `agent-compose#329` decision 8 expects this to flip later.
[tool.evalkit.coverage]
blocking = false
# Run against a roster that no longer exists, so their cases orphan permanently
# rather than pending. The two ops boards were graded under the nine-seat
# roster. board-2026-08-26 is ungraded and superseded by board-2026-09-01,
# which covers all 105 cases rather than 91 (housecast#18).
retired_runs = [
    "evaluations/pilot/ops-board-2026-08-12",
    "evaluations/pilot/ops-board-2026-08-12-regraded",
    "evaluations/reflow-v3/board-2026-08-26",
]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

[tool.agentic-os.documentation-layout]
band = "large"
# Contract and bundle fixtures model bundle trees. Seed roster definitions are
# product assets validated by the person loader, not repository documentation.
# evaluations/** is committed run evidence carried over from housecast (which
# carried the identical exclude): it quotes subject output verbatim and a
# method, not repository documentation, and splitting a run record in half to
# fit a cap is how it stops being readable as evidence.
excludes = [
    "testdata/contracts/**",
    "testdata/handmade-bundle/**",
    "seed/roster/data/**",
    "evaluations/**",
]
size_excludes = ["evaluations/**"]

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
# challenges.yaml's header carries the grading-methodology reasoning behind
# each written prompt (carried from housecast, agent-compose#7929 follow-up);
# condensing 38 lines of that to a 2-line pointer with nowhere to point it
# (docs/ is at its 40-doc cap) would destroy it rather than relocate it.
# checks/data/*.yaml (same origin) carries a field-by-field inline reference,
# one comment line per data field throughout the file rather than a single
# top header, which the 2-line cap was never written to parse.
[tool.agentic-os.code-comments]
excludes = [
    ".pre-commit-config.yaml",
    "evaluations/**",
    "challenges.yaml",
    "checks/data/**",
]

# Committed eval evidence is a frozen record, carried from housecast. Its doc
# pointers name housecast's own evaluation documentation, most of which did
# not move with it (agent-compose#7929 follow-up).
[tool.agentic-os.source-doc-refs]
excludes = ["evaluations/**"]

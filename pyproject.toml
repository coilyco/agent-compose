[project]
name = "agent-compose-checks"
version = "0.1.0"
description = "Checks that exist only while agent-compose still holds the Go engine."
requires-python = ">=3.12"
# housecast is the composition engine, moved out under #337. It is consumed
# from Forgejo rather than PyPI: the distribution claim is #347 and waits on
# Kai. This is the same shape the estate already uses for aos-eval.
# Pinned by rev rather than tag while the roster moves ahead of a release: a
# housecast-v* tag triggers a PyPI publish, and spending a version number to
# satisfy a dev-time parity check is the wrong trade. Restore a tag pin at the
# next real release.
dependencies = ["housecast>=0.3.0"]

[tool.uv.sources]
housecast = { git = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast.git", rev = "e6ee237" }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["checks"]

[tool.pytest.ini_options]
testpaths = ["checks/tests"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

[tool.agentic-os.documentation-layout]
band = "large"
# Contract and bundle fixtures model bundle trees. Seed roster definitions are
# product assets validated by the person loader, not repository documentation.
excludes = [
    "testdata/contracts/**",
    "testdata/handmade-bundle/**",
    "seed/roster/data/**",
]

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]

repos:
  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: aos-precommit-v0.75.0
    hooks:
      - id: catalog-trifecta
      - id: documentation-placement
      - id: documentation-size
      - id: context-load-points
      - id: code-comments
      - id: actions-run-one-line
      - id: source-doc-refs
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
      - id: pr-guard
      - id: git-workflow
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
        exclude: (^|/)\.vscode/
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Forgejo workflows use GitHub Actions syntax; no exclude split is needed yet.
      - id: actionlint
        args:
          - -config-file
          - .github/actionlint.yaml
        files: ^\.forgejo/workflows/.*\.(ya?ml)$
  - repo: https://code.forgejo.org/forgejo/runner
    rev: v12.10.1
    hooks:
      - id: forgejo-runner-validate
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/zshrc$
        args: [--severity=error]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        # Report, do not rewrite. --force-exclude keeps _typos.toml binding.
        args: [--force-exclude]
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
  # Repo-local: the derived role palette needs agent-compose's own colour math,
  # so it cannot live in the agentic-os catalog.
  - repo: local
    hooks:
      - id: role-palette-snapshot
        name: role palette snapshot is current
        description: "Regenerate internal/palette/role-palette.txt. Role colours are derived from the whole roster at once, so one roster edit moves several of them."
        entry: go run ./cmd/agent-compose palette-snapshot
        language: system
        pass_filenames: false
        files: ^(internal/person/data/.*|internal/color/color\.go|internal/palette/snapshot\.go|internal/palette/role-palette\.txt)$

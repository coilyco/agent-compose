# Forgejo-canonical release pipeline. A red run may still have shipped, because
# the mirror check runs last and the package bumps do not read it. docs/release.md.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      publish: ${{ steps.impact.outputs.publish }}
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Validate the release commit
        run: just test

      - id: impact
        name: Classify product release impact
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BASE: ${{ github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: sh scripts/ci/release-impact.sh

      - id: tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco-flight-deck/agentic-os/actions/tag-bump@main
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          create_tag: false
          release_sha: ${{ github.sha }}

      - name: Fetch the release tag into the build checkout
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: git fetch --tags --force

      - name: Stamp the computed tag into the build checkout
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: git tag --force "$TAG" "${{ github.sha }}"

      - name: Build binaries and package metadata
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: sh scripts/ci/release-build.sh

      - name: Publish the release tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco-flight-deck/agentic-os/actions/tag-bump@main
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          create_tag: true
          release_sha: ${{ github.sha }}

      - id: create
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco-flight-deck/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: agent-compose ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
        run: sh scripts/ci/release-attach-assets.sh
      - name: Update the Homebrew tap
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-publish-tap.sh
      - name: Update the Scoop bucket
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-publish-scoop.sh

      - name: Verify the GitHub mirror carries the tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-verify-mirror.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
          NOTE: >-
            a red release may still have shipped: the package bumps run before
            the mirror check, so check the tap before concluding nothing landed
        run: python3 scripts/ci/alert-telegram.py

[project]
name = "agent-compose-evalkit"
version = "0.1.0"
description = "The Inspect board runner for this roster: agent-compose composes, housecast grades, this fans the board out to model providers."
requires-python = ">=3.12"
# checks/ (Go/Python parity) and evalkit's roster-derivation modules are
# retired - teable:coilyco-flight-deck/housecast#8041. `[eval]` pulls in
# what housecast.grade.schema needs, and evalkit/task.py runs on inspect_ai.
dependencies = [
    "housecast[eval]>=0.3.0",
    "inspect-ai>=0.3.255",
    "openai>=2.53.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
housecast = { git = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast.git", rev = "ff1e624ddfab8feaa51aed4af693e662b1c35e3a" }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["evalkit/tests"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

[tool.agentic-os.documentation-layout]
band = "large"
# Contract and bundle fixtures model bundle trees. Seed roster definitions are
# product assets validated by the person loader, not repository documentation.
# evaluations/** is committed run evidence carried over from housecast (which
# carried the identical exclude): it quotes subject output verbatim and a
# method, not repository documentation, and splitting a run record in half to
# fit a cap is how it stops being readable as evidence.
excludes = [
    "testdata/contracts/**",
    "testdata/handmade-bundle/**",
    "seed/roster/data/**",
    "evaluations/**",
]
size_excludes = ["evaluations/**"]

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
# challenges.yaml's header carries the grading-methodology reasoning behind
# each written prompt (carried from housecast, agent-compose#7929 follow-up);
# condensing 38 lines of that to a 2-line pointer with nowhere to point it
# (docs/ is at its 40-doc cap) would destroy it rather than relocate it.
[tool.agentic-os.code-comments]
excludes = [
    ".pre-commit-config.yaml",
    "evaluations/**",
    "challenges.yaml",
]

# Committed eval evidence is a frozen record, carried from housecast. Its doc
# pointers name housecast's own evaluation documentation, most of which did
# not move with it (agent-compose#7929 follow-up).
[tool.agentic-os.source-doc-refs]
excludes = ["evaluations/**"]

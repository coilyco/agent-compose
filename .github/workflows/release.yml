# GitHub release pipeline (COI-2945): tag, release and assets are made on GitHub.
# A red run may still have shipped, since the package bumps run last: docs/release.md.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository_owner == 'coilyco'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACOMPOSE_SKIP_PRECOMMIT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: coilyco/agentic-os/actions/setup-ci@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          tools: just uv

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - id: app
        uses: coilyco/agentic-os/actions/app-token@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          app_id: ${{ secrets.COILYCO_OPS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_OPS_APP_PRIVATE_KEY_BASE64 }}
          repositories: agent-compose,homebrew-tap,scoop-bucket

      - name: Validate the release commit
        run: just test

      - id: impact
        name: Classify product release impact
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BASE: ${{ github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: sh scripts/ci/release-impact.sh

      - id: tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/agentic-os/actions/tag-bump@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          create_tag: false
          release_sha: ${{ github.sha }}

      - name: Stamp the computed tag into the build checkout
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: git tag --force "$TAG" "${{ github.sha }}"

      - name: Build binaries and package metadata
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: sh scripts/ci/release-build.sh

      - name: Publish the release tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/agentic-os/actions/tag-bump@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          tag_name: ${{ steps.tag.outputs.new_tag }}
          create_tag: true
          release_sha: ${{ github.sha }}

      - id: create
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/agentic-os/actions/create-release@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          tag: ${{ steps.tag.outputs.new_tag }}
          name: agent-compose ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-attach-assets.sh

      - name: Verify every package URL serves the built bytes
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: sh scripts/ci/release-verify-assets.sh

      - name: Update the Homebrew tap
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-publish-package.sh homebrew-tap dist/agent-compose.rb Formula/agent-compose.rb

      - name: Update the Scoop bucket
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-publish-package.sh scoop-bucket dist/agent-compose.json bucket/agent-compose.json

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          NOTE: >-
            a red release may still have shipped: the package bumps run last,
            so check the tap before concluding nothing landed
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
